services:
  mcare:
    build: .
    image: mooncare-platform:latest
    container_name: mooncare
    ports:
      - "3000:3000"
    environment:
      # 生产环境请改为强随机密钥
      MCARE_SECRET: "change-me-in-production"
      MCARE_DB: "/app/data/mcare.db"
    volumes:
      - mcare-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mcare-data:
