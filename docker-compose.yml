services:
  mooncare:
    build: .
    image: mooncare:latest
    container_name: mooncare
    ports:
      - "3000:3000"
    environment:
      # 生产部署请修改会话签名密钥：
      MCARE_SECRET: "please-change-this-secret"
      MCARE_DB: "/app/data/mcare.db"
    volumes:
      # 持久化 SQLite 数据库；删除该卷即恢复初始演示数据
      - mooncare-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mooncare-data:
